# Avahi (mDNS) on the SK-18: announce the host name "sk18" (sk18.local) on the Wi-Fi interface and answer .local
# lookups. Nothing else is published for now: no services (the client defines its own later), no workstation/hardware
# records, no wide-area DNS-SD, no reflector. No D-Bus in this image: Avahi is built without it, and then the key
# `enable-dbus` must NOT appear (it makes the daemon refuse to start: 'Invalid configuration key').
[server]
use-ipv4=yes
use-ipv6=no
allow-interfaces=wlan0
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]
enable-reflector=no

[rlimits]
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=768
rlimit-stack=4194304
rlimit-nproc=3
